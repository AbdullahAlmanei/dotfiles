# Hyprlock — current wallpaper, blurred, with wallust colours (hyprlang, not Lua)
source = $HOME/.config/hypr/wallust/colors-hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    blur_passes = 3
    blur_size = 7
    contrast = 0.89
    brightness = 0.75
    vibrancy = 0.17
}

# clock
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = $foreground
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -260
    halign = center
    valign = top
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $color7
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, -440
    halign = center
    valign = top
}

# greeting
label {
    monitor =
    text = Hi there, $USER
    color = $foreground
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 56
    outline_thickness = 2
    rounding = 14
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    outer_color = $color12
    inner_color = rgba(0, 0, 0, 0.45)
    font_color = $foreground
    check_color = $color14
    fail_color = $color1
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i>Password…</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -110
    halign = center
    valign = center
}

# now playing
label {
    monitor =
    text = cmd[update:2000] playerctl metadata --format '♪  {{ artist }} — {{ title }}' 2>/dev/null
    color = $color7
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = bottom
}
